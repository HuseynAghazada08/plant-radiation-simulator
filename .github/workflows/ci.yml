name: Java checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: javac -Xlint:all -d out src/plantsim/*.java test/plantsim/*.java
      - name: Check plant behavior
        run: java -cp out plantsim.TestPlants
      - name: Check example simulation
        shell: bash
        run: |
          java -cp out plantsim.PlantSimulation examples/input.txt > simulation.txt
          grep -q '^DAY 10 - Radiation:' simulation.txt
          grep -q '^SURVIVORS$' simulation.txt
